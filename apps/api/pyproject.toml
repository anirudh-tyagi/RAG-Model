[project]
name = "rag-api"
version = "0.2.0"
description = "Document RAG API: hybrid retrieval, reranking, streaming answers with citations"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "structlog>=24.4",
    "tenacity>=9.0",
    # vector store + ONNX embeddings/reranking (no torch in the default install)
    "qdrant-client>=1.12",
    "fastembed>=0.5",
    # LLM — an OpenAI-compatible client, so Groq, Ollama Cloud, OpenAI and
    # anything else speaking that dialect are a base-URL change, not a rewrite.
    "openai>=1.59",
    # queue + shared state
    "arq>=0.26",
    "redis>=5.2",
    # ingestion
    "pymupdf4llm>=0.0.17",
    # speech to text (CTranslate2 based, no torch)
    "faster-whisper>=1.1",
    # eval CLI
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
# Higher-quality PDF layout/table extraction. Pulls in torch (~2.5GB).
docling = ["docling>=2.15"]
# LLM tracing. Tracing is a no-op when keys are unset, even with this installed.
observability = [
    "langfuse>=3.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-exporter-otlp>=1.29",
]

[project.scripts]
rag-eval = "rag.eval.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "fakeredis>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "ASYNC",         # async correctness
    "RUF",
]
ignore = ["B008"]  # FastAPI's Depends()/File() defaults are idiomatic

[tool.mypy]
# Matches .python-version. numpy's bundled stubs require >= 3.12 to parse.
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true

# Packages without shipped stubs, plus the optional extras that may not be
# installed at all (docling, langfuse, opentelemetry).
[[tool.mypy.overrides]]
module = [
    "fastembed.*",
    "pymupdf4llm.*",
    "faster_whisper.*",
    "arq.*",
    "langfuse.*",
    "docling.*",
    "opentelemetry.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
